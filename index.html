<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coming Soon</title>
<style>
  /* পুরো পেজের জন্য background image */
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background: url("background.png") no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  /* overlay effect jate text clear dekha jay */
  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.65); /* dark overlay */
    backdrop-filter: blur(5px);    /* blur effect */
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1; /* overlay-r upor text asbe */
    color: white;
  }

  .title {
    font-size: 3em;
    font-weight: bold;
    color: #00bcd4;
    margin-bottom: 0.5em;
  }

  .subtitle {
    font-size: 1.2em;
    color: #ddd;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="title">🚀 Coming Soon</div>
    <div class="subtitle">I'm working hard to bring this site live. Stay tuned!</div>
